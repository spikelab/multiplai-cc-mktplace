[project]
name = "research-pipeline"
version = "0.1.0"
description = "Deep-research pipeline for the deep-research skill"
requires-python = ">=3.12"
dependencies = [
    # The [sdk] extra, not a bare pin: this pipeline reaches the SDK only
    # through multiplai_core.run_agent(), so core is the right place for the
    # floor and stating it a second time here is how it drifted. Declaring
    # `claude-agent-sdk>=0.1.0` alongside core (as this did until 2026-07-30)
    # silently undercut core's own `>=0.2.116,<0.3` and resolved 0.1.56 — the
    # line that misparses the terminal result message from modern Claude CLIs
    # and raises `Claude Code returned an error result: success` after a full
    # generation. Core's pyproject says it outright: nothing injects the SDK at
    # runtime, so a consumer that wants the SDK backend must ask for [sdk].
    "multiplai-core[sdk] @ git+https://github.com/spikelab/multiplai-core@v0.10.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "trafilatura>=2.2.0",
    "tavily-python>=0.7.27",
    "exa-py>=2.16.2",
]

[project.optional-dependencies]
# Playwright is a fallback fetch strategy (JS-rendered pages), imported lazily.
# Install with `[browser]` and run `playwright install chromium` to enable it.
browser = ["playwright>=1.62.0"]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# multiplai-core is a git direct reference (not on PyPI)
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["research_pipeline"]
