# Dependencies for the video-edit pipeline.
#
# These are CLI tools, not imports: prep.py shells out to the `scenedetect`
# binary (shutil.which) alongside ffmpeg's silencedetect/blackdetect filters.
# Only stages/cursor.py imports cv2 (and numpy, which comes with it); the
# skill once had no declared dependencies at all and instead grew a 229MB
# bootstrap .venv nobody tracked. Declaring them here puts `scenedetect` on the
# shared environment's PATH and retires bootstrap.sh.
#
# Headless OpenCV on purpose: the container has no display, and the GUI build
# pulls a much larger dependency tree for windowing this never uses.
[project]
name = "video-edit-scripts"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "scenedetect>=0.7",
    "opencv-python-headless>=4.9",
    "tqdm>=4.66",
    "click>=8.1",
    # Overlays render in headless Chromium driven by Playwright. Keep this pin
    # equal to PLAYWRIGHT_VERSION in the multiplai-container Dockerfile: each
    # Playwright release expects one Chromium build, and the image ships the
    # build that version expects under PLAYWRIGHT_BROWSERS_PATH.
    "playwright==1.63.0",
]

[tool.uv]
package = false
