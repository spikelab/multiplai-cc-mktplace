<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Video job</title>
<link rel="stylesheet" href="/static/review.css">
</head>
<body>
<header>
  <h1>Video job</h1>
  <nav id="tabs" role="tablist" aria-label="Steps">
    <button type="button" role="tab" id="tab-clips" aria-controls="panel-clips" aria-selected="false">Clips</button>
    <button type="button" role="tab" id="tab-speakers" aria-controls="panel-speakers" aria-selected="false">Speakers</button>
    <button type="button" role="tab" id="tab-look" aria-controls="panel-look" aria-selected="false">Look</button>
    <button type="button" role="tab" id="tab-music" aria-controls="panel-music" aria-selected="false">Music</button>
    <button type="button" role="tab" id="tab-review" aria-controls="panel-review" aria-selected="false">Review</button>
  </nav>
  <p id="status" role="status"></p>
</header>

<section id="panel-clips" class="panel" role="tabpanel" aria-labelledby="tab-clips" hidden>
  <p class="notice"></p>
  <div class="body" hidden></div>
</section>

<section id="panel-speakers" class="panel" role="tabpanel" aria-labelledby="tab-speakers" hidden>
  <p class="notice"></p>
  <div class="body" hidden></div>
</section>

<section id="panel-look" class="panel" role="tabpanel" aria-labelledby="tab-look" hidden>
  <p class="notice"></p>
  <div class="body" hidden></div>
</section>

<section id="panel-music" class="panel" role="tabpanel" aria-labelledby="tab-music" hidden>
  <p class="notice"></p>
  <div class="body" hidden></div>
</section>

<section id="panel-review" class="panel" role="tabpanel" aria-labelledby="tab-review" hidden>
  <p class="notice" id="review-notice" hidden></p>
  <div id="review-body" class="review-grid" hidden>
    <nav id="renders" aria-label="Renders"></nav>
    <section id="player-col">
      <div id="stage">
        <video id="video" preload="metadata" playsinline></video>
        <div id="markers"></div>
      </div>
      <div id="controls">
        <button id="play" type="button" aria-label="Play">▶</button>
        <input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Seek">
        <span id="time">0:00.0 / 0:00.0</span>
        <select id="version" aria-label="Version"></select>
      </div>
      <form id="composer" hidden>
        <label for="composer-text" id="composer-label"></label>
        <textarea id="composer-text" rows="3" placeholder="What should change here?"></textarea>
        <div class="row">
          <button type="submit">Add comment</button>
          <button type="button" id="composer-cancel" class="ghost">Cancel</button>
        </div>
      </form>
      <p class="hint">Click the picture to pause and comment on that spot. Space plays and pauses; ← and → step 1 s.</p>
    </section>
    <aside id="comments">
      <h2>Pending <span id="pending-count"></span></h2>
      <ol id="pending"></ol>
      <button id="send" type="button" disabled>Send all</button>
      <h2>Sent</h2>
      <ol id="sent"></ol>
    </aside>
  </div>
</section>

<script src="/static/logic.js"></script>
<script src="/static/app.js"></script>
<script src="/static/tab-clips.js"></script>
<script src="/static/tab-speakers.js"></script>
<script src="/static/tab-look.js"></script>
<script src="/static/tab-music.js"></script>
<script src="/static/tab-review.js"></script>
</body>
</html>
