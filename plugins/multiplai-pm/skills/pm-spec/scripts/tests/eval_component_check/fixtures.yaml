  source: buildme-account-management-account-attribution-3/specs/changes/account-management/components/account-attribution/spec-issues.md
  why: open on 1 Nov; the build worktree's HEAD and merge-base are cdc8ec05
  text: |
    # Spec issues: account-management/account-attribution

    Requirements problems buildme found. Fix them with `/multiplai-pm:pm-spec revise account-management`, then run the build again.

    ## Design: specs.md#actor-name-display: Rows survive deletion of the user

    specs.md#actor-name-display: Rows survive deletion of the user: the requirement says the account reference SHALL be kept when a user is deleted, but account-model's "Deleting a cleaning company deletes its users" deletes the users together with the company, and its Account cascades with it (`Account.impresa_pulizie` CASCADE). The reference therefore cannot be kept for those rows unless that deletion is refused, which account-model forbids. The requirement should say the account reference is kept "unless the account itself is deleted, in which case it becomes empty and the actor snapshot is kept".

    Raised by buildme's design step.
