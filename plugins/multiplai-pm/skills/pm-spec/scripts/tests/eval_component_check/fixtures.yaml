    # Spec issues: account-management/account-attribution

    Requirements problems buildme found. Fix them with `/multiplai-pm:pm-spec revise account-management`, then run the build again.

    ## Design: specs.md#actor-field-inventory: Every actor field is in the inventory

    specs.md#actor-field-inventory: Every actor field is in the inventory: the automated check over "every model field that references the user model and records who performed an action" also finds the third-party `django.contrib.admin` `LogEntry.user` and django-auditlog `LogEntry.actor` (`auditlog` in INSTALLED_APPS, used by the DolceOps property history). The project cannot add account and snapshot columns to those tables, so the requirement "Each inventoried actor field has an account reference" cannot hold for them. Fix: limit the check to models in the project's own `Dolce*` apps, or name these two fields as explicit exclusions.

    Raised by buildme's design step.
