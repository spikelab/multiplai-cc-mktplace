    # Spec issues: account-management/owner-sections-bookings

    Requirements problems buildme found. Fix them with `/multiplai-pm:pm-spec revise account-management`, then run the build again.

    ## Plan review: specs.md#owner-section-guard-properties: Immobili endpoints refuse an owner without the Immobili section

    [major] The plan says only the property page calls `get_billing_profiles`. The settings page also calls it, and every owner can see that page. Guarding it with Immobili would cut owners without Immobili off from their own billing profiles.

    Suggested change: The inventory and the spec's 'every Immobili endpoint refuses' rule come from upstream, so this needs a requirements decision. One option: `owner-sections-source` moves `GET /api/get-billing-profiles/` out of the Immobili entry. It could become section-independent, or an account-settings endpoint that keeps today's rules. Until that is decided, Block 6 should not add the guard to `get_billing_profiles`. Whatever the decision, add a test that an owner with only Chat still gets their billing profiles from `/api/get-billing-profiles/`.

    Raised by buildme's plan review.
