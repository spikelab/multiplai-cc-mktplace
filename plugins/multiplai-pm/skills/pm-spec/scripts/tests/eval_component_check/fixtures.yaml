  text: |
    # Spec issues: account-management/owner-sections-source

    Requirements problems buildme found. Fix them with `/multiplai-pm:pm-spec revise account-management`, then run the build again.

    ## Design audit: specs.md#owner-sections-endpoint-inventory: Section-independent endpoints

    [major] D4 puts "every endpoint the dashboard shell calls on every page (side nav, search dialog, …)" in `section_independent`. D5 asserts "the shell set's endpoints ⊆ section_independent". The shell's search dialog calls `GET api/trovalecose/` (components/dashboard/layout/search-dialog.tsx:43 → DolceSystem/views.py:398 `SearchView`). That endpoint admits owners (`HasAnyRole(..., ROLE_PROPRIETARIO)`) and returns their bookings, matched on guest name, phone, wa_id and OTA code. The spec's section-independent rule ("No section check SHALL be applied to one") would make booking and guest-contact data permanently exempt from section checks. An owner whose only section is Calendario pulizie, or one of the 11 owners with an empty menu, could keep searching all their bookings after `owner-sections-bookings` ships. This conflicts with the proposal's "the server refuses an owner the data of every page their menu hides" and with "nothing else is reachable". As written, the spec's definition ("called on every page … whatever the user's sections") captures this endpoint.

    Suggested change: Have the requirements' author narrow 'Section-independent endpoints' to endpoints that carry no client data (session, CSRF, login/logout, the allowed-sections/permissions lookups). Data-bearing shell endpoints such as `api/trovalecose/` would then be listed under the sections whose data they return; for search, that is the six booking-sheet sections. Then change D5's shell assertion to accept shell endpoints from `booking_sheet`, and note that the frontend hides search for owners who have none of those sections.

    Raised by buildme's design audit.
