    # Spec issues: account-management/account-billing

    Requirements problems buildme found. Fix them with `/multiplai-pm:pm-spec revise account-management`, then run the build again.

    ## Design: specs.md#account-billing-ownership: Billing profiles belong to the account

    specs.md#account-billing-ownership: Billing profiles belong to the account: "No code path SHALL use them for billing" conflicts with account-billing-ownership "Property-to-profile choice is not restricted by the move", which forbids any new restriction on which profile a property may use. After release, an operator can still assign a legacy-flagged profile to a property by id through `add_or_update_profile` or onboarding. Fix: say either that properties SHALL NOT be assigned legacy-only profiles (an explicit, allowed restriction), or that the "no code path" clause holds only at migration time.

    Raised by buildme's design step.
