  text: |
    # Spec issues: account-management/owner-sections-source

    Requirements problems buildme found. Fix them with `/multiplai-pm:pm-spec revise account-management`, then run the build again.

    ## Design audit: specs.md#owner-sections-endpoint-inventory: Booking-sheet endpoints listed under every section that opens the sheet

    [critical] Gating every booking-sheet endpoint would also gate the session check. D3 defines `booking_sheet` as "the reference list of every endpoint the booking sheet calls". Block 7 applies the gate "to every `booking_sheet` route". The booking sheet calls `/api/check-session/` (`frontend/src/components/booking/dettagli-pagamento.tsx:52`, and also `app/booking/[bookingId]/page.tsx`). That same endpoint is called on every page by `context/auth-context.tsx`, `components/session-interceptor/session-interceptor.tsx` and `side-nav.tsx`, including under `/clng`. Following the spec literally, `/api/check-session/` goes under the six sections and never under `calendario_pul` ("Booking-sheet endpoints under all six sections"). The gate would then return 403 on it to an owner whose sections are only `calendario_pul`, or empty. That breaks session handling across the app for those owners, the 11 empty-menu owners included. The Jest coverage scan has the same conflict. It follows imports transitively from each section's `frontend_roots`, so it would require `/api/check-session/` and `/api/allowed-sections/` under `calendario_pul`, which booking-sheet test 3 forbids. Neither the spec nor the design defines section-independent infrastructure endpoints that sit outside the inventory and the gate.

    Suggested change: Get the requirement changed so that the booking-sheet and coverage rules leave out a fixed list of section-independent endpoints: at least `GET /api/check-session/` and `GET /api/allowed-sections/`, plus logout and profile endpoints if the sheet or layout calls them. Then in D3, add a top-level `infrastructure` key to the inventory. The Jest scan accepts these calls without a section, the gate is never applied to them, and a pytest test asserts that none of them appears in `booking_sheet` or `sections`. In Block 7, add a test: an owner with only `calendario_pul` calls `GET /api/check-session/` and gets the same response as before.

    Raised by buildme's design audit.
