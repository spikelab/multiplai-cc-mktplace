  source: buildme-account-management-owner-sections-bookings-3/specs/changes/account-management/components/owner-sections-bookings/spec-issues.md
  why: open on 1 Nov; the build worktree merged cdc8ec05 (merge-base cdc8ec05)
  text: |
    # Spec issues: account-management/owner-sections-bookings

    Requirements problems buildme found. Fix them with `/multiplai-pm:pm-spec revise account-management`, then run the build again.

    ## Design: specs.md#owner-section-guard-rules: Sections come from the single owner-section definition

    specs.md#owner-section-guard-rules: Sections come from the single owner-section definition: the scenario "Server and menu agree" requires each endpoint in the five inventories to answer if and only if the menu shows the owner one of its sections, but the inventories list endpoints that refuse every owner whatever their sections. Some are operator-only (`"operator_only": true`, e.g. `POST /api/channex/calendar/update-availability/`, `DELETE /api/cancellaprenodyretta/<str:dolce_id>/`) and one is manager-only (`GET /api/booking/<uuid:booking_id>/legal-status/`, `HasAnyRole(ROLE_MANAGER)`). Fix: restrict the scenario to endpoints that answered owners before this change, or state that the section check admits the request if and only if the menu shows one of the sections.

    Raised by buildme's design step.
