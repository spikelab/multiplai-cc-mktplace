- id: 12d3faa9/dolceops-account-list/T2
  commit: 12d3faa9
  component: dolceops-account-list
  source: triage-2026-11-02
  n: 2
  severity: major
  verdict: real
  reason: The rule "the same as on the property's owner tab today" points at nothing. The tab's save sends
    the fields as they are, and `_assign_fields` sets them and calls `save()` with no format or required
    checks (the only check is the model's `nome` NOT NULL). So the "Invalid value refused" scenario has
    nothing to copy.
  evidence: dolceops-account-list specs.md:238,244-246 (Editable fiscal and payment data); backend/DolcePMS/endpointz/onboard.py:20-46
    (`_assign_fields`), :52-68 (CAMPI_PROPRIETARIO), :355-361; tab-proprietario.tsx:86-95 (`saveProprietario`,
    no validation); dolceops-account-list plan.md:35 (claims onboard.py "validates", which it does not)
  description: 'The requirement says validation on the sheet is ''the same as on the property''s owner
    tab today'' and that an invalid value, including the IBAN, is refused with a message. The owner tab
    does no validation today. The save path writes owner fields with no checks (no IBAN format, no required
    name), there are no required-field rules for the owner, and the tab itself checks nothing. So the
    scenario ''a value the owner tab would reject'' has nothing to copy: a builder must either invent
    rules or ship a check that never refuses anything.'
- id: 12d3faa9/dolceops-account-list/T3
  commit: 12d3faa9
  component: dolceops-account-list
  source: triage-2026-11-02
  n: 3
  severity: major
  verdict: real
  reason: The requirement covers "the account's" fiscal and payment data on every sheet, OM sheets included,
    but its validation rule, the sync rule and the plan cover only owner data (`Proprietario`). An OM's
    payment data sits on `Manager` and has no registry fields. Nothing says what an OM sheet shows or
    edits.
  evidence: 'dolceops-account-list specs.md:238 (Editable fiscal and payment data), :249 (Sheet and property
    owner tab stay in sync: "For owner accounts"); plan.md:23,33; backend/DolceSystem/models.py:301-325
    (Manager iban, intestatario_conto_bancario, nome_banca)'
  description: 'The sheet makes ''the account''s fiscal (registry) data and payment data'' editable for
    every OM and owner account, with validation ''the same as on the property''s owner tab''. The owner
    tab and the sync rule only cover owner data. An OM''s data is on the Manager record: IBAN, bank holder,
    bank, BIC, email, phone and commission, but no fiscal registry fields. No requirement and no existing
    screen says which OM fields the sheet shows or edits, or how they are validated.'
- id: 12d3faa9/dolceops-account-list/T4
  commit: 12d3faa9
  component: dolceops-account-list
  source: triage-2026-11-02
  n: 4
  severity: major
  verdict: real
  reason: 'The finding overstates one part: the spec does say properties, not units. But a cleaning company
    is assigned per room type (`CleaningInfo.cleaning_company` is on a RoomType, which belongs to an Immobile).
    So "the properties assigned to it" leaves a builder to guess whether a property counts when only some
    of its units are assigned to the company.'
  evidence: dolceops-account-list specs.md:24 (One entry per account with its summary fields); backend/DolcePMS/models.py:795-809
    (CleaningInfo one-to-one with RoomType), :270-271 (RoomType.immobile FK)
  description: Units are defined as 'the number of properties linked to the account (for a cleaning company,
    the properties assigned to it)'. A cleaning company is assigned per unit (room type), through the
    unit's cleaning details, not per property. One property can have units cleaned by different companies.
    The column is called 'units' but the definition counts properties, so a builder must guess whether
    to count properties or units and how to count a property that is only partly assigned.
- id: 12d3faa9/dolceops-account-list/T5
  commit: 12d3faa9
  component: dolceops-account-list
  source: triage-2026-11-02
  n: 5
  severity: minor
  verdict: real
  reason: An empty OM name is refused, but nothing covers an owner account whose registry name is empty.
    `Proprietario.nome` accepts "" and `_assign_fields` writes it as it is, while account-model says every
    account SHALL have a name. This overlaps finding 2 (no validation rules), but it is about a different
