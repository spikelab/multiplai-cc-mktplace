- id: cdc8ec05/account-attribution/T2
  commit: cdc8ec05
  component: account-attribution
  source: triage-2026-11-02
  n: 2
  severity: major
  verdict: real
  reason: A row a system process wrote has an empty user and empty snapshots, and so does a deleted user's
    row with no snapshot. The fallback shows "Utente eliminato" for both, where today such rows show "Sistema".
    The plan changes the shared `UserChip`, which the excluded auditlog property history also uses.
  evidence: 'account-attribution specs.md:79-81 (Scenario: Action with no user), :140,150-152 (Fallback
    when the user has no name); frontend/src/components/audit/user-chip.tsx:39,42 ("Sistema"); backend/DolceChannex/tasks.py:49,121
    (`requested_by=None`, shown as "sistema"); plan.md:33; UserChip used by storico-entry-card.tsx / storico-api.ts
    (property history)'
  description: Today, rows with no user show 'Sistema'. Both `UserChip` and the compact calendar log table
    do this, and `CalendarOpsJob` rows from scheduled tasks are written with `requested_by=None` so they
    show as 'sistema'. The spec's fallback shows 'Utente eliminato' whenever the user reference is empty
    and the snapshot is empty. Rows written by a system process (which the spec itself keeps, with empty
    user and snapshot) look exactly like rows of a deleted user. After the change they would read 'Utente
    eliminato' instead of 'Sistema'. `UserChip` is also used by the DolceOps property history (auditlog),
    which this spec excludes, so that view would change too.
- id: cdc8ec05/account-attribution/T3
  commit: cdc8ec05
  component: account-attribution
  source: triage-2026-11-02
  n: 3
  severity: major
  verdict: real
  reason: '`Cleaning.updated_by` is on the plan''s list and is overwritten on every status update. So
    the rule that the account reference never changes after the row is written either leaves the account
    out of step with the user, or breaks.'
  evidence: account-attribution specs.md:65-70 (Account reference is fixed at the time of the action);
    plan.md:31; backend/DolceSystem/dolcecleaning/endpoints.py:102 (`cleaning.updated_by = request.user`);
    backend/DolceSystem/models.py:1037
  description: The spec says the account reference and the actor snapshot are fixed once a row is written.
    But `Cleaning.updated_by`, which is in the plan's list of fields, records the most recent person to
    update the cleaning. It is overwritten on every status update (`cleaning.updated_by = request.user`
    in `backend/DolceSystem/dolcecleaning/endpoints.py`). If the account and snapshot stay as first written,
    they no longer match the user beside them. If they follow the user, they break the 'fixed' rule.
- id: cdc8ec05/account-attribution/T4
  commit: cdc8ec05
  component: account-attribution
  source: triage-2026-11-02
  n: 4
  severity: major
  verdict: real
  reason: The check is meant to find every field that "references the user model and records who performed
    an action", but there are two user models. Many links to them are not actor fields, such as `Utente.user`,
    `Manager.user`, `Operatore` and `Account.titolare`. No rule says how an automated check tells actor
    links from the others, so the builder has to invent the classification.
  evidence: 'account-attribution specs.md:21-23 (Scenario: Every actor field is in the inventory); backend/DolceSystem/models.py:46,130,233,302,411
    (Utente.user, operatore, UtenteLoginHistory.user, Manager.user, Account.titolare); backend/DolceLog/models.py:81,135
    and backend/DolceCleaning/models.py:213 (FKs to DolceSystem.Utente); backend/DolceSystem/models.py:1037
    (FK to auth User)'
  description: 'The automated inventory check has to find every field ''that references the user model
    and records who performed an action''. The project has two user models: `auth.User` (used by Cleaning,
    BookingNote, DolcePricing, DolceFinance and UtenteLoginHistory) and `DolceSystem.Utente` (used by
    CalendarChangeLog, AutoResponseToggleLog, CalendarOpsJob and CleaningMessageLog). Many links to these
    models are not actor fields at all, such as `Utente.user`, `Manager.user`, `Operatore.user` and `Account.titolare`.
    The spec gives no way to tell actor fields from the rest automatically, so the builder has to guess
    what the check counts and what it ignores.'
- id: cdc8ec05/account-attribution/T5
  commit: cdc8ec05
  component: account-attribution
  source: triage-2026-11-02
  n: 5
  severity: major
  verdict: false
  reason: 'The code claim is right (`UtenteLoginHistory.user` is CASCADE and not nullable), but the plan
    puts `UtenteLoginHistory.user` on the inventory explicitly, and "Rows survive deletion of the user"
    covers every inventoried row. So the builder does not have to guess: they make it nullable with SET_NULL
    and keep the rows. The "deliberate cascade" claim is not borne out either: the cited review only notes
    that admin deletion cascades to login history, as a permissions finding.'
  evidence: plan.md:31; account-attribution specs.md:165-172 (Rows survive deletion of the user); backend/DolceSystem/models.py:232-238;
    account-model reviews/block-01-round-4.json:81
  description: The spec says rows survive user deletion with their user reference set to empty. `UtenteLoginHistory.user`
    is required and is deleted together with its user today (CASCADE). An earlier review records this
    cascade as deliberate for cleaning-company deletion. To meet the spec, login history would have to
    start being kept after a user is deleted, which is new behaviour. Neither this spec nor the account-model
    and account-user-api specs mention it. A builder would have to guess whether login history really
    counts as an actor field under this rule.
