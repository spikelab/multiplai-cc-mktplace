- id: 12d3faa9/account-attribution/T1
  commit: 12d3faa9
  component: account-attribution
  source: triage-2026-11-02
  n: 1
  severity: critical
  verdict: real
  reason: 'Accounts are deleted with their cleaning company, owner or OM, and account-model says a cleaning
    company''s deletion SHALL NOT be refused, while attribution says a row''s account reference never
    changes and rows survive. Each `on_delete` choice for the new account reference breaks one of these:
    CASCADE deletes the rows, SET_NULL changes the reference, PROTECT refuses the deletion. Same root
    problem as check 1 #6, in another component.'
  evidence: account-attribution specs.md:57-58,157-158; account-model specs.md:83-89; backend/DolceSystem/accounts.py:162-168,234-243;
    backend/DolceSystem/models.py:381-410
  description: 'The spec says the account reference on a row never changes after it is written, and that
    when a user is deleted the rows survive and keep that reference. But the account itself is deleted
    whenever its cleaning company, owner or manager is deleted: `_elimina_account_prima_dell_entita` deletes
    it on pre_delete, and `Account.impresa_pulizie/proprietario/manager` cascade. The account-model spec
    says deleting a cleaning company deletes all its users and ''SHALL NOT be refused''. So the rows written
    by those users can''t keep their account reference. Either the deletion is blocked (breaks account-model),
    the rows are deleted (breaks ''Rows survive deletion''), or the reference is emptied (breaks ''fixed
    at the time of the action'').'
- id: 12d3faa9/account-attribution/T2
  commit: 12d3faa9
  component: account-attribution
  source: triage-2026-11-02
  n: 2
  severity: major
  verdict: real
  reason: 'The plan puts `Cleaning.updated_by` in the inventory, and the code overwrites it on every update
    (or sets it to None). "Record the acting user and their account" asks for the new account on each
    write, while "Account reference is fixed" says the reference SHALL NOT change after the row is written:
    two rules for the same write.'
  evidence: 'plan.md (`DolceSystem/models.py` line: `Cleaning.updated_by`); backend/DolceSystem/dolcecleaning/endpoints.py:102,398,401;
    backend/DolceSystem/models.py:1037; account-attribution specs.md:36-39,57-58'
  description: The inventory has to include `Cleaning.updated_by`. That field records the last user to
    change a cleaning and is overwritten on every update (`DolceSystem/dolcecleaning/endpoints.py` sets
    `updated_by = request.user`, or None for anonymous updates). The spec says the account reference and
    snapshot are taken when the row is written and SHALL NOT change afterwards. For a 'last updated by'
    field, a later update by another account's user would leave the user and the account out of step.
- id: 12d3faa9/account-attribution/T4
  commit: 12d3faa9
  component: account-attribution
  source: triage-2026-11-02
  n: 4
  severity: major
  verdict: real
  reason: The fallback chain says when to show "Utente eliminato" but not what a row with no user ever
    shows, such as a system process or a user deleted before the release. Those rows look the same as
    a deleted user with no snapshot. Today `UserChip` and `audit_history` show "Sistema", and the plan's
    chip change lists only stored name, then username, then "Utente eliminato", so a builder has to guess.
  evidence: account-attribution specs.md:71-73,131-144; frontend/src/components/audit/user-chip.tsx:39,42;
    backend/DolcePMS/audit_history.py:413-417; plan.md (user-chip.tsx line)
  description: Once the user is gone, the views show the stored name, then the stored username, then 'Utente
    eliminato'. But rows written by a system process (no user, empty snapshot) and rows whose user was
    already deleted before the release (user already emptied, backfill had nothing to copy) look exactly
    like a deleted user with no snapshot. They would all show 'Utente eliminato'. Today the shared chip
    shows 'Sistema' for these (`user-chip.tsx`, `audit_history._autore`). Nothing says how system actions
    should be shown or told apart.
- id: 12d3faa9/account-attribution/T5
  commit: 12d3faa9
  component: account-attribution
  source: triage-2026-11-02
  n: 5
  severity: major
  verdict: false
  reason: The plan puts `UtenteLoginHistory.user` in the inventory, and "Rows survive deletion of the
    user" says plainly that inventoried rows are kept with the user set to null. So the change from today's
    CASCADE to SET_NULL is required, and a builder would build exactly that. Keeping a deleted person's
    IP addresses and locations is a product or privacy question worth raising with the PM, not something
    a builder would have to guess.
  evidence: backend/DolceSystem/models.py:232-238 (CASCADE); plan.md (`UtenteLoginHistory.user`); account-attribution
    specs.md:157-158
  description: The spec puts `UtenteLoginHistory.user` in the inventory and says deleting a user SHALL
    NOT delete the rows that record them, setting the user to empty instead. Today the field is `on_delete=CASCADE`,
    so deleting a user deletes their login history. The spec doesn't say this behaviour changes, or that
    logins count as recorded actions rather than out-of-scope 'reads'. Keeping it would also keep a deleted
    person's IP addresses and locations.
- id: 12d3faa9/account-attribution/T6
  commit: 12d3faa9
  component: account-attribution
  source: triage-2026-11-02
  n: 6
  severity: minor
  verdict: false
  reason: 'Both rules are explicit, and the scenarios fix the result: current name while the user exists,
    stored name after deletion. The finding itself says "Both rules are stated", so a builder builds the
    same thing whatever the reader expects.'
  evidence: account-attribution specs.md:117,123-125,160,166-168
  description: While the user exists, the views show the user's current name; after deletion, they show
    the name stored when the row was written. So a user renamed from 'Giulia Rossi' to 'Giulia Bianchi'
    shows as 'Bianchi' until deleted, then goes back to 'Rossi' on the same entries. Both rules are stated,
    but together they make the displayed name jump back, and a reader may not expect that.
- id: 1c19e875/owner-sections-source/T1
