# Labelled findings of the component check on the DFACCMGMT-1 replay.
# Each entry is one finding a check raised at `commit` on `component`, with a
# verdict a person or an agent reached by reading the Dolcebot code and specs
# at that commit (read-only). `source`: triage-2026-11-02 (the tables in
# triage-2026-11-02/, `n` = the finding's number in its check),
# matched-2026-11-01 (the finding the 2026-11-01 judge matched to a P problem),
# or adjudicated-<run> (an unlabelled finding of that eval run, `n` its number).
# `verdict` is `real` or `false` (YAML reads the bare word false as a boolean;
# the eval takes it as the verdict false). See README.md for how to add entries.
labels:
- id: c5712a34/dolcecleaning-users/T2
  commit: c5712a34
  component: dolcecleaning-users
  source: triage-2026-11-02
  n: 2
  severity: major
  verdict: false
  reason: 'The code claim is right (the edit dialog has an is_active switch and PUT accepts `is_active`),
    but the specs already settle it: the Utenti endpoints must do user management through `account-user-api`,
    whose edit cannot change status, and deactivation must follow a confirmation and the Owner rule, so
    a builder cannot keep a switch that deactivates; at most they choose to remove a control that no longer
    does anything. Borderline: a one-line "the switch is removed" would make it explicit.'
  evidence: 'dolcecleaning-users specs.md:6 (Cleaning-company user management is operator-only), :130
    (Deactivation and reactivation from the Utenti tab), :184 (Editing a user''s details); account-user-api
    specs.md:189 (Editable personal details: "Role, status and account SHALL NOT change"); frontend/src/app/dolceops/dolcecleaning/impresa/[impresaId]/page.tsx:142,406,1250;
    backend/DolceCleaning/views.py:476-519'
  description: '''Editing a user''s details'' lists name, surname, email and phone as editable. It never
    says whether the user''s active status stays in the edit form. Today the Utenti edit dialog has an
    active switch (editUserActive), and the edit endpoint accepts is_active. That switch lets someone
    deactivate a user with no confirmation, and lets an operator outside the list deactivate the Owner.
    This goes against the confirmation rule and the restricted ''deactivate Owner'' rule in this spec.
    It also goes against account-user-api, which says status does not change through edit. A builder has
    to guess whether the switch stays.'
- id: c5712a34/dolcecleaning-users/T3
  commit: c5712a34
  component: dolcecleaning-users
  source: triage-2026-11-02
  n: 3
  severity: major
  verdict: real
  reason: 'The finding overstates it: account-model does require that deleting a company deletes its users.
    But that requirement says "as today", and today users are only unlinked (SET_NULL), never deleted.
    Today''s delete is also refused while room types are linked. And no requirement says what happens
    to the company''s account, while the component that owns the company endpoints has no delete requirement.'
  evidence: account-model specs.md:83-89 (Deleting a cleaning company deletes its users); backend/DolceSystem/models.py:104-107
    (`impresa_pulizie_pms` on_delete=SET_NULL); backend/DolceCleaning/views.py:277-286 (DELETE refuses
    with 409 when CleaningInfo rows are linked, then `provider.delete()`); dolcecleaning-users plan.md:31
    (views.py change list names create and rename, not delete)
  description: 'This component changes the company endpoints and makes every cleaning company an account.
    Its ''dolcecleaning-company-account'' capability covers creating and renaming a company but not deleting
    one. account-model says deleting a company deletes every user of its account, and must not be refused
    because the account has users. Today''s delete does neither: it refuses deletion while room types
    are linked, and users are only unlinked from the company, not deleted. No requirement says what happens
    to the company''s account when the company is deleted, or which component makes deletion remove the
    users.'
- id: c5712a34/dolcecleaning-users/T4
  commit: c5712a34
  component: dolcecleaning-users
  source: triage-2026-11-02
  n: 4
  severity: minor
  verdict: real
  reason: Today's PUT stores an empty name as None (`nome` is nullable), while account-model says every
    account SHALL have a name and the rename rule copies the company name into the account name. A builder
    has to guess whether to refuse an empty name or allow an account with no name.
  evidence: backend/DolceCleaning/views.py:271-273; backend/DolcePMS/models.py:115 (`nome` null=True);
    account-model specs.md:32 (Account has its own name); dolcecleaning-users specs.md:255 (Company name
    is edited in DolceCleaning)
  description: '''Company name is edited in DolceCleaning'' says a rename changes the account name. It
    does not say what happens when the name is cleared. Today''s company edit stores an empty name as
    no name at all, while every account must have a name. A builder has to guess whether an empty company
    name is refused.'
- id: c5712a34/dolcecleaning-users/T5
  commit: c5712a34
  component: dolcecleaning-users
  source: triage-2026-11-02
  n: 5
  severity: minor
  verdict: false
  reason: 'The "an active user" wording is loose, but the same requirement''s scenarios settle the Owner
    case: no deactivate action for operators outside the list, and Owner deactivation for listed operators.
    The account-team rule gives the same visible result, so a builder would build the same thing either
    way.'
  evidence: dolcecleaning-users specs.md:150-157 (scenarios Deactivating the Owner by a non-authorised
    / authorised operator), :162-165 (Operator outside the list), :442-447 (Ordinary deactivation not
    offered on the Owner)
  description: '''Deactivation and reactivation from the Utenti tab'' says the tab offers deactivation
    of ''an active user'' after a confirmation, which includes the Owner. The account team says the ordinary
