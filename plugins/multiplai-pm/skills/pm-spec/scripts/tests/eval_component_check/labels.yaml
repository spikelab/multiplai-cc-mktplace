- id: cdc8ec05/owner-sections-bookings/T1
  commit: cdc8ec05
  component: owner-sections-bookings
  source: triage-2026-11-02
  n: 1
  severity: major
  verdict: real
  reason: Same problem as check 3 finding 4, with the same text. `OwnerSectionsFromInventory.has_permission`
    takes no per-endpoint sections, so "declares sections different from its inventory" cannot be tested.
  evidence: backend/DolceEngine/endpoint_guard/permissions.py:67-96; bookings/specs.md "Checks are endpoint_guard
