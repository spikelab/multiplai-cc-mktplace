- id: 12d3faa9/owner-sections-bookings/T1
  commit: 12d3faa9
  component: owner-sections-bookings
  source: triage-2026-11-02
  n: 1
  severity: critical
  verdict: false
  reason: 'Every refuse requirement carries the shared-endpoint exception ("except where… / unless the
    endpoint is shared…"), and the write-effect requirements apply only to "a refused owner request".
    The write scenarios hold for an owner holding none of the endpoint''s sections. The inventory facts
    are right: Front office has only `GET /api/frontoffizz/` of its own, and Prenotazioni only `GET /api/prenotaziony/`.
    That makes those scenarios thin examples, not a contradiction.'
  evidence: bookings/specs.md:6, :43, :59-60, :101, :107-109, :123, :156; backend/DolceSystem/owner_sections_inventory.json
    sections.frontoffice/.prenotazioni
  description: 'The write requirements for Prenotazioni, Front office and Immobili say any write endpoint
    in the section''s inventory returns HTTP 403 to an owner without that section, with no exception for
    shared endpoints. In the committed inventory every Prenotazioni and Front office write is shared:
    POST /api/verify-whatsapp-number/, POST /api/save-whatsapp-to-customer/ and POST /api/channex/direct-booking/create/,
    which are booking-sheet or shell endpoints listed under six sections. Front office has no write endpoint
    of its own; the only Prenotazioni-only endpoint is the read GET /api/prenotaziony/. The Immobili writes
    owners can use, such as POST /api/toggle-task-completed/ (shared with Dashboard) and the booking-sheet
    writes, are shared too. Under ''An endpoint shared by several sections admits any of them'', an owner
    without Front office but with Calendario must be served by these endpoints. Under the write requirements
    and their scenarios (''Owner without Front office attempts a write'', ''Owner without Prenotazioni
    tries to edit a booking'', ''Owner without Immobili attempts to edit a property''), the same owner
    must get 403 and nothing may change.'
- id: 12d3faa9/owner-sections-bookings/T2
  commit: 12d3faa9
  component: owner-sections-bookings
  source: triage-2026-11-02
  n: 2
  severity: major
  verdict: real
  reason: '"Each endpoint answers if and only if the menu shows at least one of its sections" cannot hold.
    Many inventoried endpoints refuse every owner today (`operator_only: true`, e.g. bulk calendar jobs,
    operator-tools, direct-booking modify/cancel), and legal-status is `HasAnyRole(ROLE_MANAGER)`. The
    "as before" requirements keep those refusals.'
  evidence: owner_sections_inventory.json (operator_only entries); backend/DolceWebsite/checkbox_legal.py:1299-1302;
    bookings/specs.md:151-153 vs :26-27
  description: '''Server and menu agree'' requires each endpoint in the five inventories to answer if
    and only if the menu shows the owner at least one of its sections. Many inventoried endpoints refuse
    every owner today, whatever their sections. The inventory marks them operator_only (for example POST
    /api/channex/calendar/update-availability/, the bulk calendar jobs, PATCH /api/immobile/add-or-update-profile/
    and the operator-tools routes). GET /api/booking/<uuid>/legal-status/ is limited to OMs (HasAnyRole(ROLE_MANAGER)
    in DolceWebsite/checkbox_legal.py get_booking_legal_status). The ''answer as before'' requirements
    keep these refusals for owners who hold the section, so the ''if and only if'' cannot hold.'
- id: 12d3faa9/owner-sections-bookings/T4
  commit: 12d3faa9
  component: owner-sections-bookings
  source: triage-2026-11-02
  n: 4
  severity: major
  verdict: real
  reason: The spec requires each endpoint to "declare the matching class, with exactly the sections" and
    a test comparing declared sections with the inventory. The plan says to add five per-section classes.
    But the existing `OwnerSectionsFromInventory` (D5) takes no sections and looks each route and method
    up in the inventory at request time. The builder must guess which design is meant and what the test
    checks.
  evidence: backend/DolceEngine/endpoint_guard/permissions.py:67-96; bookings/specs.md:264-273; bookings/plan.md
    "Code this component changes" (first bullet)
  description: 'The requirement says every inventoried endpoint shall declare ''the matching class, with
    exactly the sections whose inventories list it'', and that a test fails if the declared sections differ
    from the inventory. The plan speaks of five separate section classes. The code already has one guard,
    OwnerSectionsFromInventory (decision D5). It declares no sections: at request time it looks the route
    up in the inventory and refuses any unlisted route or method. With that guard, ''declares sections
    different from its inventory'' has no meaning, and nothing says whether per-section classes or the
    single inventory-driven guard is meant. The builder has to guess what the coverage test checks.'
- id: 12d3faa9/owner-sections-bookings/T5
