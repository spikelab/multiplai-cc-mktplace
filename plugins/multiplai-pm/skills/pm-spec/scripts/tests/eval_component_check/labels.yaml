- id: cdc8ec05/account-billing/T2
  commit: cdc8ec05
  component: account-billing
  source: triage-2026-11-02
  n: 2
  severity: critical
  verdict: real
  reason: 'Same as check 1 #5, and the revision left this text unchanged: the excluded legacy-only profiles
    have no account, while "Profile without account is rejected" refuses any save without one, and operators
    can update any profile. "Critical" overstates it, since the rows belong to inactive logins, but a
    builder still has to guess.'
  evidence: account-billing specs.md:6,13-15 (unchanged in diff 12d3faa9..cdc8ec05); billing_profiles.py:231-236
  description: The requirement makes the account link mandatory for every billing profile, and the scenario
    'Profile without account is rejected' says any save of a profile without an account is refused. The
    same requirement keeps the legacy-only profiles with no account. Operators can update any profile
    today (update_billing_profile allows operators on every profile). So any later save of such a profile,
    even an unrelated field edit by an operator, must be both refused (no account) and allowed (the stated
    exception). The plan's 'required link to the account' cannot be a database-level requirement while
    those rows exist.
- id: cdc8ec05/account-billing/T3
  commit: cdc8ec05
  component: account-billing
  source: triage-2026-11-02
  n: 3
  severity: major
  verdict: real
  reason: 'Same as check 1 #1 and #2 together, unchanged by the revision: no rule covers creating a profile
    as an operator, and none places the existing operator-created profiles in the migration. Owner accounts
    with no users (account-model) can only be served by an operator, which makes the gap larger.'
  evidence: billing_profiles.py:118-123,168,193; account-billing specs.md:21-22,115; account-model specs.md:12-14,238-239
  description: Profiles are listed, created, updated and deleted 'by the caller's account', but operators
    have no client account. Operators reach the billing settings page and create-billing-profile. Today
    a profile an operator creates is linked to the operator's own login (create_billing_profile sets utente=request.user.utente).
    Nothing says which account a profile created by an operator belongs to, or how an operator adds a
    profile to an account. Account-model also allows owner accounts with no users, and they can only be
    served by an operator. The migration also aborts on any profile whose user has no account, so every
    profile an operator created in the past stops the release, and no rule says where those profiles go.
- id: cdc8ec05/account-billing/T4
  commit: cdc8ec05
  component: account-billing
  source: triage-2026-11-02
  n: 4
  severity: major
  verdict: real
  reason: 'Same as check 1 #3, unchanged: profiles with no user still abort the migration, and no placement
    rule or fix-by-hand route is given. The revision added a fix-by-hand route only for properties that
    use legacy-only profiles.'
  evidence: billing.py:232-237; account-billing specs.md:115 (cdc8ec05), 117-119
  description: 'The migration aborts on any profile ''linked to no user at all''. Today ProfiloFatturazione.utente
    is null=True with on_delete=SET_NULL, so every profile whose login was deleted in the past has no
    user, and properties may still invoice with them. Legacy-only profiles get a stated way through, but
    these do not: nothing says which account they should go to or who decides. The release is blocked
    until someone guesses.'
- id: cdc8ec05/account-billing/T5
  commit: cdc8ec05
  component: account-billing
  source: triage-2026-11-02
  n: 5
  severity: major
  verdict: real
  reason: 'Same as check 1 #7, unchanged: reads from a profile to its user (`force_airbnb_host_case`,
    the API''s `utente` field) have no stated replacement. For `force_airbnb_host_case` the obvious mapping,
    the account''s `proprietario`, gives today''s result, so the guess is small; the API field is still
    open.'
  evidence: force_airbnb_host_case.py:99-100,297-298; billing_profiles.py:88; account-billing specs.md:53-66
  description: 'The requirement only covers code that goes from a user to their profiles. Code also goes
    the other way, from a profile to its user and on to the owner: force_airbnb_host_case reads profilo.utente.proprietario
