- id: 12d3faa9/account-billing/T6
  commit: 12d3faa9
  component: account-billing
  source: triage-2026-11-02
  n: 6
  severity: major
  verdict: real
  reason: 'The account row is deleted with its owner, OM or cleaning company (`pre_delete` receiver plus
    `CASCADE` one-to-ones), and nothing says what happens to its billing profiles. A builder must choose
    `on_delete`: CASCADE would hit `Immobile.profilo_fatturazione` PROTECT and refuse the deletion, SET_NULL
    breaks the mandatory link, PROTECT refuses the deletion. "Profile stays usable..." covers user deletion
    only.'
  evidence: backend/DolceSystem/accounts.py:234-243,260-272; backend/DolceSystem/models.py:381-410 (Account.manager/proprietario/impresa_pulizie
    CASCADE); backend/DolcePMS/models.py:194-196 (PROTECT); account-billing specs.md:37-51; account-model
    specs.md:83-84
  description: 'Today the account is deleted together with its owner, OM or cleaning company (backend/DolceSystem/accounts.py
    removes it before the entity is deleted). account-model requires that deleting a cleaning company
    is not refused because of its users. Once a profile''s account link is mandatory, nothing says what
    happens to an account''s billing profiles when the account is deleted. The choices are: delete them,
    which properties block because a property''s profile link is protected (Immobile.profilo_fatturazione
    PROTECT); leave them with no account, which breaks the mandatory link; or refuse the deletion. ''Profile
    stays usable when a user is deactivated or deleted'' covers deleting users only.'
- id: 12d3faa9/account-billing/T7
  commit: 12d3faa9
  component: account-billing
  source: triage-2026-11-02
  n: 7
  severity: minor
  verdict: real
  reason: 'The requirement covers only reads from a user to their profiles. `force_airbnb_host_case` goes
    the other way (`profilo.utente.proprietario`, plus `select_related` on that path), and the API returns
    `"utente"` for each profile. Removing the user link, which the plan does, leaves these without a stated
