- id: cdc8ec05/account-attribution/P8
  commit: cdc8ec05
  component: account-attribution
  source: matched-2026-11-01
  n: 1
  problem: P8
  severity: critical
  verdict: real
  reason: 'It is P8, which buildme raised after the handoff (buildme-account-management-account-attribution-3/specs/changes/account-management/components/account-attribution/spec-issues.md);
    the 2026-11-01 judge matched it: Both describe the ''Rows survive deletion of the user'' requirement
    conflicting with account-model''s company deletion, which cascades the Account, so the account reference
    cannot be kept, and both propose clearing the account reference and keeping a snapshot.'
  evidence: fixtures.yaml P8
  description: 'The spec says the account reference on a row never changes after it is written, and that
    the rows and their account reference survive when the user is deleted. In the code, deleting a cleaning
    company or an owner also deletes its Account (`_elimina_account_prima_dell_entita` in `backend/DolceSystem/accounts.py`).
    The account-model spec says deleting a cleaning company deletes all its users and must not be refused.
    So when a company is deleted, the attributed rows can only do one of three things: be deleted with
    the account (breaks ''rows survive''), lose their account reference (breaks ''account reference kept
    and fixed''), or block the deletion (breaks the account-model rule). All the rules cannot hold together.'
