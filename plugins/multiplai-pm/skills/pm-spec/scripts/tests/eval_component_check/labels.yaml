- id: 12d3faa9/account-billing/T1
  commit: 12d3faa9
  component: account-billing
  source: triage-2026-11-02
  n: 1
  severity: critical
  verdict: real
  reason: '`create_billing_profile` links each new profile to the caller''s login whatever the caller''s
    role, and operators can reach the billing page; operators belong to no account, so the migration''s
    "user has no account" check aborts on every operator-created profile, and no rule says where those
    profiles go. Whether production holds any is a data question I could not check.'
  evidence: backend/DolceFinance/views/billing_profiles.py:168,193; account-billing specs.md:115,117-119;
    account-model specs.md:6 ("Every client user"), :238-239; account-attribution specs.md:65 (operator
    "belongs to no account"); account-model codebase-analysis.md:483 (billing page reads role, operator
    branch)
  description: The account-billing-migration requirement 'Migration fails loudly on profiles it cannot
    place' stops the migration if any billing profile is linked to a user that has no account. Operators
    are users that never get an account (account-model, 'Operators keep cross-client access'). Today create_billing_profile
    in backend/DolceFinance/views/billing_profiles.py links every new profile to whoever is logged in,
    operators included, and operators may create profiles for clients. So any profile an operator has
    ever created makes the migration stop. No requirement says which account an operator-created profile
    goes to, or who fixes it, so the migration cannot finish on production-shaped data.
- id: 12d3faa9/account-billing/T2
  commit: 12d3faa9
  component: account-billing
  source: triage-2026-11-02
  n: 2
  severity: major
  verdict: real
  reason: After release, "Billing profiles belong to the account" needs an account on every new profile,
    but an operator caller has no account and the create request carries none, so a builder has to guess
    whether operators pick an account or lose the ability to create profiles. The plan's "by the caller's
    account" does not cover this case.
  evidence: account-billing specs.md:6,8-15; plan.md "Code this component changes" (billing_profiles.py
    line); billing_profiles.py:160-209
  description: 'The account-billing-ownership requirement ''Billing profiles belong to the account'' says
    every new profile references ''that account'', and a profile saved without an account is refused.
    When an operator creates a profile, there is no caller account to use: operators belong to no account,
    and the create endpoint today takes no account from the request. Nothing says which account an operator-created
    profile belongs to, so operators either can no longer create profiles or a builder has to guess.'
- id: 12d3faa9/account-billing/T3
  commit: 12d3faa9
  component: account-billing
  source: triage-2026-11-02
  n: 3
  severity: major
  verdict: real
  reason: '`ProfiloFatturazione.utente` is `null=True, on_delete=SET_NULL`, so deleting a user (for example
    `elimina_utenti_impresa`) leaves profiles with no user; the migration must abort on them, and nothing
    says how they get placed. The only ways to get past the abort, unlinking or deleting the profiles,
    break "Migration preserves profile identity" (SHALL NOT delete) and "Property assignments survive".
    Whether such rows exist in production is unchecked.'
  evidence: backend/DolceFinance/models/billing.py:232-237; backend/DolceSystem/accounts.py:162-168; account-billing
    specs.md:96,108,115,117-119
  description: Today the link from a profile to its user is optional and is cleared when the user is deleted
    (ProfiloFatturazione.utente is null=True, on_delete=SET_NULL). Profiles with no user can therefore
    already exist, and properties may still use them. The migration requirement aborts on any such profile.
    Nothing says how these profiles get an account, so the migration may never complete. If someone unlinks
    or deletes them to get past the stop, that breaks 'Property assignments survive the migration'.
- id: 12d3faa9/account-billing/T5
  commit: 12d3faa9
  component: account-billing
  source: triage-2026-11-02
  n: 5
  severity: minor
  verdict: real
  reason: The requirement keeps legacy-only profiles with no account, while the scenario "Profile without
    account is rejected" refuses any save without an account; operators can update any profile, so a builder
    has to guess whether saving such a profile is refused. Also, the plan's "required link" cannot be
