    a user to their profiles. Other existing code goes the other way, from a profile to its user, and
    has no replacement once the user link is removed. The force_airbnb_host_case command matches a profile
    to a property''s owner through the profile''s user. The billing-profile API returns a ''utente'' field
    for every profile. The scenario ''Lookup from a property''s owner'' describes a path from owner to
    profiles that does not exist in today''s code.'
- id: 12d3faa9/account-billing/T8
  commit: 12d3faa9
  component: account-billing
  source: triage-2026-11-02
  n: 8
  severity: minor
  verdict: false
  reason: 'The rule is clear: a profile goes to its user''s account, which for logins 44 and 61 is the
    account recorded for them. The scenario "Property keeps a profile of another account" already accepts
    that a property may use a profile that ends up in a different account from its owner, with assignments
    and invoices unchanged.'
  evidence: account-billing specs.md:68-74,80-85,107-112; account-model specs.md:317-327
  description: '''Each existing profile moves to its user''s account'' sends the profiles of logins 44
