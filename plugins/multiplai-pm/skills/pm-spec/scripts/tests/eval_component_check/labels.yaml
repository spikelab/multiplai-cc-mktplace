- id: cdc8ec05/owner-sections-bookings/T4
  commit: cdc8ec05
  component: owner-sections-bookings
  source: triage-2026-11-02
  n: 4
  severity: minor
  verdict: real
  reason: The existing class refuses an owner on any route or method missing from the inventory, even
    one holding the section. DRF runs permissions before it routes the method, so an owner holding the
    section who sends an accepted but unlisted method gets 403 where today they got 200 or 405. OPTIONS,
    which `@api_view` always accepts, is one such method. That breaks "same status … for the same request",
    and nothing says which rule wins.
  evidence: backend/DolceEngine/endpoint_guard/permissions.py:87-89 (`endpoint is None` → False); bookings/specs.md
    "Calendario endpoints answer an owner with the section as before", "Every Calendario endpoint is covered"
  description: The 'Every Calendario/Prenotazioni endpoint is covered' scenarios call each endpoint 'with
    each HTTP method the endpoint accepts', and the 'as before' requirements cover any request. The inventory
    lists only the methods the pages call. The existing class refuses an owner on any method the inventory
    does not list, even an owner who holds the section. No requirement says what an owner who holds the
    section gets for a method the endpoint accepts but the inventory does not list. A builder would have
    to guess between 'refused' and 'as before'.
