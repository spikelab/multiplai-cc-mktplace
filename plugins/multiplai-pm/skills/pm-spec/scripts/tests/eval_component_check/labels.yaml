  reason: '`Section` includes `reporting`, the link-save code accepts every enum value, and `AllowedSectionsView`
    returns stored values as they are. So "only seven names" and "menu identical for every owner" give
    different answers for any row holding `reporting` or an un-normalised `ari_calendar`. The spec does
    not say which wins. (The later built `get_owner_sections` intersects with `OWNER_SECTIONS`, which
    shows the builder had to pick one.)'
  evidence: backend/DolceSystem/models.py:950 (REPORTING), :954-960 (ari_calendar left until `normalizza_sezione_calendario`
    runs); backend/DolceSystem/endpointz/manager_owner_links.py:130-131, :236-237, :337-338; backend/DolceSystem/autenticazzone.py:53-72
    (`sections.update(link.sections)`); spec "Only known section names returned" vs "Menu entries unchanged
    for every owner"; 12d3faa9 backend/DolceSystem/auth_utils.py:214
  description: '''Only known section names returned'' says the function returns only seven stored identifiers
    and treats `reporting` as a legacy name that geperman never stores. In the code, `reporting` is a
