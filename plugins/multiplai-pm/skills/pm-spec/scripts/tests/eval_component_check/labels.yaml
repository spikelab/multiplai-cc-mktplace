- id: 12d3faa9/owner-sections-bookings/T7
  commit: 12d3faa9
  component: owner-sections-bookings
  source: triage-2026-11-02
  n: 7
  severity: minor
  verdict: false
  reason: The sentence says the refusal is "raised by an `endpoint_guard` permission class before any
    … data is read". A DRF permission class runs before the view by construction, so a builder implements
    it the same way, and the guard's own section lookup is clearly not "property data" in that sense.
  evidence: bookings/specs.md:79, :101, :123; backend/DolceEngine/endpoint_guard/permissions.py:79-96
  description: The Immobili and Front office requirements say the refusal is raised 'before any property
