# Dependencies for the memory-engine scripts (hooks + skill entry points).
# Consolidated from 26 PEP 723 blocks on 2026-08-04; see the workspace root
# pyproject.toml for why. The [sdk] extra is required, not optional: nothing
# injects claude-agent-sdk at runtime, so AgentSDKClient degrades to the
# API backend without it.
[project]
name = "multiplai-context-scripts"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "multiplai-core[sdk]",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

# Member-local source so this directory also resolves standalone — an
# installed plugin is a copy of the plugin subtree only (no workspace root
# above it), so without this the bare multiplai-core name would be looked
# up on PyPI, where it does not exist. In-repo, uv still resolves through
# the workspace root and the single uv.lock.
[tool.uv.sources]
multiplai-core = { git = "https://github.com/spikelab/multiplai-core", branch = "main" }
