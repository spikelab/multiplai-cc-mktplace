<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<style>
  :root {
    --bg: #fbfbfa; --fg: #1d1f21; --muted: #5f6368; --line: #e3e3e0; --side: #f3f3f1;
    --accent: #0f766e; --code-bg: #1d1f21; --link: #0b5cad;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181b; --fg: #e6e6e3; --muted: #a0a4a8; --line: #2c2f33; --side: #1d2024;
      --accent: #2dd4bf; --code-bg: #0e1012; --link: #7cb7ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 18px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--link); }
  #progress { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: var(--bg);
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; z-index: 3; font-size: 14px; }
  #bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #menu { display: none; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 2px 10px; }
  aside { position: fixed; top: 40px; bottom: 0; left: 0; width: 280px; overflow-y: auto; background: var(--side);
    border-right: 1px solid var(--line); padding: 16px; font-size: 15px; z-index: 2; }
  aside h1 { font-size: 17px; margin: 0 0 12px; }
  aside ol { list-style: none; padding: 0; margin: 0; }
  aside a { display: block; padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); }
  aside a.active { background: var(--accent); color: #fff; }
  main { margin-left: 280px; padding: 56px 32px 64px; max-width: 1100px; }
  .intro { color: var(--muted); }
  .step { display: none; }
  .step.active { display: block; }
  table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 15px; margin: 12px 0; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  code { font-size: 0.88em; overflow-wrap: anywhere; }
  pre { border-radius: 8px; overflow-x: auto; font-size: 14px; }
  pre:not(.mermaid) { background: var(--code-bg); }
  pre.mermaid { background: transparent; text-align: center; }
  blockquote { border-left: 3px solid var(--accent); margin: 12px 0; padding: 0 12px; color: var(--muted); }
  .pager { display: flex; justify-content: space-between; margin-top: 32px; }
  .pager button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--side); color: var(--fg); cursor: pointer; }
  @media (max-width: 768px) {
    #menu { display: inline-block; }
    aside { transform: translateX(-100%); transition: transform .2s; width: 85%; }
    aside.open { transform: none; }
    main { margin-left: 0; padding: 56px 16px 48px; }
    body { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="progress"><button id="menu" type="button" aria-label="Steps">☰</button><span id="count"></span><div id="bar"><div></div></div></div>
<aside id="side"><h1>{{TITLE}}</h1><ol>
{{NAV}}
</ol></aside>
<main>
<div class="intro">{{INTRO}}</div>
{{STEPS}}
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
(function () {
  var steps = Array.prototype.slice.call(document.querySelectorAll('.step'));
  var links = Array.prototype.slice.call(document.querySelectorAll('aside a'));
  var rendered = {};
  var current = 1;
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  try { if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' }); } catch (e) {}
  function show(n) {
    if (!steps.length) return;
    n = Math.max(1, Math.min(steps.length, n));
    current = n;
    steps.forEach(function (s, i) { s.classList.toggle('active', i + 1 === n); });
    links.forEach(function (a) { a.classList.toggle('active', +a.dataset.step === n); });
    var active = links[n - 1];
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
    document.getElementById('count').textContent = 'Step ' + n + ' of ' + steps.length;
    document.querySelector('#bar > div').style.width = (100 * n / steps.length) + '%';
    if (history.replaceState) history.replaceState(null, '', '#step-' + n);
    var step = steps[n - 1];
    if (!rendered[n] && window.mermaid) {
      rendered[n] = true;
      try { mermaid.run({ nodes: step.querySelectorAll('.mermaid') }); } catch (e) {}
    }
    if (window.Prism) Prism.highlightAllUnder(step);
    window.scrollTo(0, 0);
    document.getElementById('side').classList.remove('open');
  }
  links.forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); show(+a.dataset.step); }); });
  steps.forEach(function (s) {
    s.querySelector('.prev').addEventListener('click', function () { show(current - 1); });
    s.querySelector('.next').addEventListener('click', function () { show(current + 1); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') show(current + 1);
    if (e.key === 'ArrowLeft') show(current - 1);
  });
  document.getElementById('menu').addEventListener('click', function () {
    document.getElementById('side').classList.toggle('open');
  });
  var m = /^#step-(\d+)$/.exec(location.hash);
  show(m ? +m[1] : 1);
})();
</script>
</body>
</html>
