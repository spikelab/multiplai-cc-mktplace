<!doctype html>
<html lang="en">
<head>
<title>{{TITLE}}</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" media="(prefers-color-scheme: light)"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/github.min.css"
      integrity="sha512-0aPQyyeZrWj9sCA46UlmWgKOP0mUipLQ6OZXu8l4IcAmD2u31EPEy9VcIMvl7SoAaKe8bLXZhYoMaE/in+gcgA=="
      crossorigin="anonymous">
<link rel="stylesheet" media="(prefers-color-scheme: dark)"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/github-dark.min.css"
      integrity="sha512-rO+olRTkcf304DQBxSWxln8JXCzTHlKnIdnMUwYvQa9/Jd4cQaNkItIUj6Z4nvW1dqK0SKXLbn9h4KwZTNtAyw=="
      crossorigin="anonymous">
<style>
  :root {
    color-scheme: light;
    --bg: #fbfbfa; --fg: #1d1f21; --muted: #5f6368; --line: #e3e3e0; --side: #f3f3f1;
    --accent: #0f766e; --on-accent: #ffffff; --link: #0b5cad; --code-bg: #f6f8fa; --code-fg: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #16181b; --fg: #e6e6e3; --muted: #a0a4a8; --line: #2c2f33; --side: #1d2024;
      --accent: #2dd4bf; --on-accent: #06201d; --link: #7cb7ff; --code-bg: #0d1117; --code-fg: #e6edf3;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16181b; --fg: #e6e6e3; --muted: #a0a4a8; --line: #2c2f33; --side: #1d2024;
    --accent: #2dd4bf; --on-accent: #06201d; --link: #7cb7ff; --code-bg: #0d1117; --code-fg: #e6edf3;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow-wrap: break-word;
    font: 18px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--link); }
  #progress { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: var(--bg);
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; z-index: 3; font-size: 14px; }
  #count { white-space: nowrap; }
  #bar { flex: 1; min-width: 0; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #menu { display: none; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 2px 10px; }
  aside { position: fixed; top: 40px; bottom: 0; left: 0; width: 280px; overflow-y: auto; background: var(--side);
    border-right: 1px solid var(--line); padding: 16px; font-size: 15px; z-index: 2; }
  aside h1 { font-size: 17px; margin: 0 0 12px; }
  aside ol { list-style: none; padding: 0; margin: 0; }
  aside a { display: block; padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); overflow-wrap: anywhere; }
  aside a.active { background: var(--accent); color: var(--on-accent); }
  main { margin-left: 280px; padding: 56px 32px 64px; max-width: 1100px; min-width: 0; }
  main [id] { scroll-margin-top: 56px; }
  .intro { color: var(--muted); }
  .step { display: none; }
  .step.active { display: block; }
  table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; font-size: 15px; margin: 12px 0; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  code { font-size: 0.88em; overflow-wrap: anywhere; }
  pre { max-width: 100%; overflow-x: auto; font-size: 14px; border-radius: 8px; padding: 12px 16px;
    background: var(--code-bg); color: var(--code-fg); }
  pre code, pre code.hljs { padding: 0; background: transparent; overflow-wrap: normal; }
  pre.mermaid { background: transparent; text-align: center; padding: 0; }
  pre.mermaid svg { max-width: 100%; height: auto; }
  blockquote { border-left: 3px solid var(--accent); margin: 12px 0; padding: 0 12px; color: var(--muted); }
  .pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 32px; }
  .pager button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--side); color: var(--fg); cursor: pointer; }
  @media (max-width: 768px) {
    #menu { display: inline-block; }
    aside { transform: translateX(-100%); transition: transform .2s; width: 85%; }
    aside.open { transform: none; }
    main { margin-left: 0; padding: 56px 16px 48px; }
    body { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="progress"><button id="menu" type="button" aria-label="Steps">&#9776;</button><span id="count"></span><div id="bar"><div></div></div></div>
<aside id="side"><h1>{{TITLE}}</h1><ol>
{{NAV}}
</ol></aside>
<main>
<div class="intro">{{INTRO}}</div>
{{STEPS}}
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"
        integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.15.0/mermaid.min.js"
        integrity="sha512-HH52omhHpZF6RfVnGiQwYgYm4H/ya2xsZYLl5xJ4+tLfX+rN4+8zF7V/H/KLeicPrKZYi1g6iBmVkk2AhXTGlg=="
        crossorigin="anonymous"></script>
<script>
(function () {
  var steps = Array.prototype.slice.call(document.querySelectorAll('.step'));
  var links = Array.prototype.slice.call(document.querySelectorAll('aside a[data-step]'));
  var side = document.getElementById('side');
  var decorated = {};
  var current = 1;
  var theme = document.documentElement.getAttribute('data-theme');
  var dark = theme === 'dark' || (theme !== 'light' && !!window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
  try { if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' }); } catch (e) {}
  try {
    if (window.hljs) {
      hljs.configure({ ignoreUnescapedHTML: true });
      hljs.registerAliases(['markup'], { languageName: 'xml' });   // the Markdown names HTML snippets `markup`
    }
  } catch (e) {}

  // Highlight code and draw diagrams once per step, when it is first shown:
  // mermaid cannot measure a diagram inside a hidden step.
  function decorate(n, target) {
    if (decorated[n]) return;
    decorated[n] = true;
    var step = steps[n - 1];
    if (window.hljs) {
      Array.prototype.forEach.call(step.querySelectorAll('pre code[class*="language-"]'), function (el) {
        try { hljs.highlightElement(el); } catch (e) {}
      });
    }
    var nodes = step.querySelectorAll('pre.mermaid');
    if (window.mermaid && nodes.length) {
      try {
        var done = mermaid.run({ nodes: nodes });
        if (done && done.then) {
          // A drawn diagram changes the height above the target, so scroll to it again.
          done.then(function () { if (target) target.scrollIntoView({ block: 'start' }); }, function () {});
        }
      } catch (e) {}
    }
  }

  function show(n, target) {
    if (!steps.length) return;
    n = Math.max(1, Math.min(steps.length, n));
    current = n;
    steps.forEach(function (s, i) { s.classList.toggle('active', i + 1 === n); });
    links.forEach(function (a) { a.classList.toggle('active', +a.dataset.step === n); });
    var active = links[n - 1];
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
    document.getElementById('count').textContent = 'Step ' + n + ' of ' + steps.length;
    document.querySelector('#bar > div').style.width = (100 * n / steps.length) + '%';
    side.classList.remove('open');
    decorate(n, target);
    if (target) target.scrollIntoView({ block: 'start' });
    else window.scrollTo(0, 0);
  }

  function setHash(hash, push) {
    if (location.hash === hash) return;
    try {
      if (push) history.pushState(null, '', hash);
      else history.replaceState(null, '', hash);
    } catch (e) {}
  }

  // `#step-N` shows step N. Any other hash names an element: show the step
  // that holds it and scroll it into view. False when nothing has that id.
  function route(hash) {
    var m = /^#step-(\d+)$/.exec(hash || '');
    if (m) { show(+m[1]); return true; }
    var id = (hash || '').slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    var el = id ? document.getElementById(id) : null;
    if (!el) return false;
    var step = el.closest ? el.closest('.step') : null;
    if (step) show(steps.indexOf(step) + 1, el);
    else el.scrollIntoView({ block: 'start' });
    return true;
  }

  function go(n) {
    show(n);
    setHash('#step-' + current, false);
  }

  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var hash = a.getAttribute('href');
    if (!route(hash)) return;
    e.preventDefault();
    setHash(hash, true);
  });
  window.addEventListener('hashchange', function () { route(location.hash); });
  steps.forEach(function (s) {
    s.querySelector('.prev').addEventListener('click', function () { go(current - 1); });
    s.querySelector('.next').addEventListener('click', function () { go(current + 1); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') go(current + 1);
    if (e.key === 'ArrowLeft') go(current - 1);
  });
  document.getElementById('menu').addEventListener('click', function () { side.classList.toggle('open'); });
  if (!route(location.hash)) go(1);
})();
</script>
</body>
</html>
