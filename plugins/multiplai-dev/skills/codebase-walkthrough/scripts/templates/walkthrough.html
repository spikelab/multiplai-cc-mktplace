<!doctype html>
<html lang="en">
<head>
<title>{{TITLE}}</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" media="(prefers-color-scheme: light)"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/github.min.css"
      integrity="sha512-0aPQyyeZrWj9sCA46UlmWgKOP0mUipLQ6OZXu8l4IcAmD2u31EPEy9VcIMvl7SoAaKe8bLXZhYoMaE/in+gcgA=="
      crossorigin="anonymous">
<link rel="stylesheet" media="(prefers-color-scheme: dark)"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/github-dark.min.css"
      integrity="sha512-rO+olRTkcf304DQBxSWxln8JXCzTHlKnIdnMUwYvQa9/Jd4cQaNkItIUj6Z4nvW1dqK0SKXLbn9h4KwZTNtAyw=="
      crossorigin="anonymous">
<style>
  /* One reading column beside a sticky contents rail; tables, code and diagrams scroll in their own boxes. */
  :root {
    color-scheme: light;
    --bg: #f4f6f8; --surface: #ffffff; --ink: #15212c; --muted: #566573; --rule: #d6dde4;
    --accent: #0b6a8a; --accent-soft: #e2f0f5; --neutral-bg: #e9edf1; --code-bg: #eef2f5;
    --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f161c; --surface: #16202a; --ink: #e3eaf0; --muted: #98a8b6; --rule: #2a3946;
      --accent: #5cc0de; --accent-soft: #15323d; --neutral-bg: #22303b; --code-bg: #1d2a35;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f161c; --surface: #16202a; --ink: #e3eaf0; --muted: #98a8b6; --rule: #2a3946;
    --accent: #5cc0de; --accent-soft: #15323d; --neutral-bg: #22303b; --code-bg: #1d2a35;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px;
    line-height: 1.6; overflow-wrap: break-word; }
  .wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto;
    padding: 32px 16px 80px; }
  nav.toc { position: sticky; top: 20px; align-self: start; font-size: 14px; }
  nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: s; }
  nav.toc li { counter-increment: s; }
  nav.toc a { display: block; padding: 4px 8px; border-radius: 4px; color: var(--muted); text-decoration: none; }
  nav.toc a::before { content: counter(s) ". "; font-family: var(--f-mono); font-size: 11px; }
  nav.toc a:hover, nav.toc a:focus-visible, nav.toc a.active { background: var(--accent-soft); color: var(--ink); outline: none; }
  main { min-width: 0; }
  main [id] { scroll-margin-top: 16px; }
  header.top { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 8px; }
  .eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  h1 { font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1.1; margin: 6px 0 10px; }
  h2 { font-family: var(--f-display); font-weight: 600; font-size: 26px; margin: 48px 0 10px; padding-top: 12px;
    border-top: 1px solid var(--rule); }
  h3 { font-family: var(--f-display); font-weight: 600; font-size: 19px; margin: 24px 0 6px; }
  h4 { font-size: 16px; margin: 20px 0 6px; }
  p, li { max-width: 75ch; }
  .lede { font-size: 18px; margin: 0 0 8px; }
  .run { font-size: 13px; color: var(--muted); margin: 0; }
  a { color: var(--accent); }
  code { font-family: var(--f-mono); font-size: .86em; background: var(--code-bg); padding: 1px 4px; border-radius: 3px;
    overflow-wrap: anywhere; }
  pre { max-width: 100%; overflow-x: auto; font-size: 13.5px; border-radius: 6px; padding: 12px 16px;
    background: var(--code-bg); border: 1px solid var(--rule); }
  pre code, pre code.hljs { padding: 0; background: transparent; overflow-wrap: normal; }
  sup { line-height: 0; }
  a.cite { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-decoration: none;
    border-bottom: 1px dotted var(--rule); padding: 0 1px; }
  a.cite:hover, a.cite:focus-visible { color: var(--accent); border-bottom-color: var(--accent); }
  a.hop { font-size: 11px; color: var(--muted); text-decoration: none; padding: 0 1px; }
  a.hop:hover, a.hop:focus-visible { color: var(--accent); }
  span.loc { font-family: var(--f-mono); font-size: .9em; border-bottom: 1px dotted var(--rule); }
  .based { font-size: 13px; color: var(--muted); }
  .tbl { overflow-x: auto; margin: 12px 0 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
  th { font-family: var(--f-display); font-weight: 600; background: var(--neutral-bg); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .diagram { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
    padding: 16px; margin: 12px 0 18px; }
  .diagram pre.mermaid { margin: 0; background: none; border: 0; text-align: center; padding: 0; }
  pre.mermaid svg { max-width: 100%; height: auto; }
  .cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; margin: 12px 0; }
  .case, .item { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 16px 8px; }
  .item { margin: 12px 0; }
  .case h3, .item h3 { margin-top: 12px; }
  .meta { font-size: 14px; color: var(--muted); }
  ol.steps { padding-left: 22px; }
  ol.steps > li { max-width: none; margin: 0 0 12px; }
  ol.steps > li::marker { font-family: var(--f-display); font-weight: 600; color: var(--accent); }
  ol.steps h3 { display: inline; font-size: 17px; }
  details { margin: 8px 0; }
  details > summary { cursor: pointer; color: var(--accent); font-size: 14px; }
  details.more > *:not(summary) { margin-left: 4px; }
  details.sub { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 14px; }
  details.sub > summary { color: var(--ink); }
  details.sub > summary h3 { display: inline; margin: 0; font-size: 17px; }
  blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft); margin: 12px 0; padding: 4px 14px;
    border-radius: 0 6px 6px 0; }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: minmax(0, 1fr); gap: 8px; padding-top: 20px; }
    nav.toc { position: static; border: 1px solid var(--rule); border-radius: 6px; padding: 8px; background: var(--surface); }
    nav.toc ol { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    h1 { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="wrap">
<nav class="toc" aria-label="Contents"><ol>
{{NAV}}
</ol></nav>
<main>
{{HEADER}}
{{BODY}}
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"
        integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ=="
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.15.0/mermaid.min.js"
        integrity="sha512-HH52omhHpZF6RfVnGiQwYgYm4H/ya2xsZYLl5xJ4+tLfX+rN4+8zF7V/H/KLeicPrKZYi1g6iBmVkk2AhXTGlg=="
        crossorigin="anonymous"></script>
<script>
(function () {
  var theme = document.documentElement.getAttribute('data-theme');
  var dark = theme === 'dark' || (theme !== 'light' && !!window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
  try { if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' }); } catch (e) {}
  try {
    if (window.hljs) {
      hljs.configure({ ignoreUnescapedHTML: true });
      hljs.registerAliases(['markup'], { languageName: 'xml' });   // the Markdown names HTML snippets `markup`
      Array.prototype.forEach.call(document.querySelectorAll('pre code[class*="language-"]'), function (el) {
        try { hljs.highlightElement(el); } catch (e) {}
      });
    }
  } catch (e) {}

  // Mermaid cannot measure a diagram inside a closed <details>, so each one is drawn when it is first shown.
  function closed(el) {
    for (var d = el.closest('details'); d; d = d.parentElement && d.parentElement.closest('details')) {
      if (!d.open) return true;
    }
    return false;
  }
  function draw(root) {
    if (!window.mermaid) return;
    var nodes = Array.prototype.filter.call(root.querySelectorAll('pre.mermaid:not([data-drawn])'),
                                            function (el) { return !closed(el); });
    if (!nodes.length) return;
    nodes.forEach(function (el) { el.setAttribute('data-drawn', '1'); });
    try { mermaid.run({ nodes: nodes }); } catch (e) {}
  }
  document.addEventListener('toggle', function (e) {
    if (e.target && e.target.open) draw(e.target);
  }, true);

  // A link to an id inside closed <details> (a path hop such as #p2h3) opens every <details> around it.
  function reveal(hash) {
    var id = (hash || '').slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    var el = id ? document.getElementById(id) : null;
    if (!el) return false;
    for (var d = el.closest('details'); d; d = d.parentElement && d.parentElement.closest('details')) d.open = true;
    if (el.tagName === 'DETAILS') el.open = true;
    draw(document);
    el.scrollIntoView({ block: 'start' });
    return true;
  }
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var hash = a.getAttribute('href');
    if (!reveal(hash)) return;
    e.preventDefault();
    try { history.pushState(null, '', hash); } catch (err) {}
  });
  window.addEventListener('hashchange', function () { reveal(location.hash); });

  // The rail marks the section being read.
  var links = Array.prototype.slice.call(document.querySelectorAll('nav.toc a'));
  if (window.IntersectionObserver) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (a) { a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id); });
      });
    }, { rootMargin: '0px 0px -70% 0px' });
    Array.prototype.forEach.call(document.querySelectorAll('main > section[id]'), function (s) { io.observe(s); });
  }

  draw(document);
  if (location.hash) reveal(location.hash);
})();
</script>
</body>
</html>
