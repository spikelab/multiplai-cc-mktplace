[project]
name = "build-pipeline"
version = "0.1.0"
description = "Deterministic build pipeline for the buildme skill ecosystem"
requires-python = ">=3.12"
dependencies = [
    # The [sdk] extra, not a bare pin alongside it: every LLM call here goes
    # through multiplai_core.run_agent(), so core owns the version floor and
    # restating it here only creates a second copy that can drift. Core's
    # extra is >=0.2.116,<0.3 and is covered by a regression test there; a
    # hand-written duplicate is not, so a future floor bump in core would
    # silently fail to reach this pipeline. Nothing injects the SDK at
    # runtime, which is why asking for [sdk] is required, not optional.
    "multiplai-core[sdk]",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Round-trip YAML for `build_pipeline setup`: it edits specs/config.yaml
    # and must keep the comments and key order a person wrote. Used only in
    # setup.py; every reader stays on PyYAML.
    "ruamel.yaml>=0.19",
    # The shared "work out what this code does" step: the codebase analysis
    # phase and the block facts (see [tool.uv.sources] below).
    "code-facts",
]

[project.optional-dependencies]
# jsonschema: a test validates the facts.json the analysis phase writes
# against review/schema/facts.v1.schema.json. pytest-xdist: CI runs the
# suite with `-n auto`.
dev = ["pytest", "pytest-asyncio", "jsonschema>=4", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# multiplai-core is a git direct reference (not on PyPI)
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["build_pipeline"]

# Member-local source so this directory also resolves standalone — an
# installed plugin is a copy of the plugin subtree only (no workspace root
# above it), so without this the bare multiplai-core name would be looked
# up on PyPI, where it does not exist. In-repo, uv still resolves through
# the workspace root and the single uv.lock.
[tool.uv.sources]
multiplai-core = { git = "https://github.com/spikelab/multiplai-core", branch = "main" }
# The shared explore step. An editable path source, not `workspace = true`:
# the installed plugin is plugins/multiplai-dev/ alone, and lib/ sits inside
# that copy. code_facts is not a workspace member, because uv rejects a member
# that is also reached through a path source.
code-facts = { path = "../../../lib/code_facts", editable = true }
