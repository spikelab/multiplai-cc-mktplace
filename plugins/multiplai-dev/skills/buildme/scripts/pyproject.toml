[project]
name = "build-pipeline"
version = "0.1.0"
description = "Deterministic build pipeline for the buildme skill ecosystem"
requires-python = ">=3.12"
dependencies = [
    # The [sdk] extra, not a bare pin alongside it: every LLM call here goes
    # through multiplai_core.run_agent(), so core owns the version floor and
    # restating it here only creates a second copy that can drift. Core's
    # extra is >=0.2.116,<0.3 and is covered by a regression test there; a
    # hand-written duplicate is not, so a future floor bump in core would
    # silently fail to reach this pipeline. Nothing injects the SDK at
    # runtime, which is why asking for [sdk] is required, not optional.
    "multiplai-core[sdk]",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# multiplai-core is a git direct reference (not on PyPI)
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["build_pipeline"]
