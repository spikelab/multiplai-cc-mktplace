name: CI

# This repo is published — installing a plugin copies these files onto someone
# else's machine. Until this workflow existed there was no CI of any kind, so
# nothing checked the tree before it was consumed. Two gates and the existing
# test suites run on every push and PR; a third gate (`changelog-gate`) runs on
# PRs only, because what it checks is a property of the proposed release.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Structural lint + security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # All three gates are stdlib-only and offline on purpose: a check that
      # guards publication should not itself depend on the network being up.
      - name: Structural lint
        run: python scripts/lint_skills.py

      - name: Security scan
        run: python scripts/scan_skills.py --all

      # One environment. Catches an undeclared pyproject.toml (uv silently
      # gives it its own .venv) and any PEP 723 block creeping back in — the
      # latter is what made the prompt hooks re-resolve on every invocation.
      # Its stray-.venv check cannot fire here: those are gitignored, so a
      # fresh CI checkout never has one. That half only works run locally.
      - name: Workspace hygiene
        run: python scripts/lint_workspace.py

      - name: Gate self-tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest scripts/tests/ -q

  changelog-gate:
    name: changelog-gate
    # Users update a plugin from Claude Code's `/plugin` menu, which offers the
    # update by version number and nothing else. A plugin whose behaviour
    # changed under an unchanged version therefore either ships invisibly or
    # does not ship at all — and either way the user has nothing to read. The
    # convention (bump the version, write the notes, tag it) was documented
    # from the start and checked by nobody; this is the check.
    #
    # `pull_request` only, deliberately: gating pushes to `main` would make an
    # in-flight branch unpushable, and the exemptions below live on the PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The gate diffs against the merge base, so it needs real history — the
      # default shallow fetch has none.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # `--depth=0` is not a valid git argument ("depth 0 is not a positive
      # number") — the full history comes from `fetch-depth: 0` on the checkout
      # above. This fetch only needs to make the base ref itself resolvable.
      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      # Label and body are passed through the environment rather than
      # interpolated into the shell: a PR body is attacker-controlled text.
      - name: Changelog gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python scripts/check_changelog.py --base "origin/${{ github.base_ref }}"

  promotion-gate:
    name: Promotion gate over every shipped skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The gate executes each bundled entry point with --help, and routes
      # PEP 723 scripts through `uv run --script` so their declared deps are
      # present. Without uv those scripts die on import and the gate reports a
      # warning it can't act on.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Keyed on the lock, so a run only pays the cold-cache cost when the
          # dependency set actually changed.
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The media skills' entry points refuse to start without ffmpeg (they
      # print the platform-appropriate install hint and exit non-zero), so
      # without it here the gate reports a host-tool gap, not a skill defect.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Build the environment *before* the gate, not inside it. The gate asks
      # "does this entry point hang?" with a 30s budget; on a cold cache the
      # first `uv run` also had to resolve the lock and clone the git-sourced
      # `multiplai-core`, which regularly blew that budget and was reported as
      # a timeout — a hung script, which it was not. ~40% of runs in one batch
      # (issue #114). Paying for it here makes the gate measure the script.
      - name: Warm the workspace environment
        run: uv sync --all-packages --frozen

      # Runs before the self-tests: this step prints the per-skill hint for
      # anything that fails, where the pytest sweep only reports the names.
      - name: Run the gate over every skill
        run: |
          status=0
          for skill in plugins/*/skills/*/; do
            if ! out=$(python3 plugins/multiplai-dev/skills/skill-creator/scripts/promote_skill.py "$skill"); then
              echo "$out"
              status=1
            fi
          done
          exit "$status"

      - name: Gate self-tests
        run: |
          uv run --with pytest python -m pytest \
            plugins/multiplai-dev/skills/skill-creator/scripts/tests/ -q

      - name: Run the CONTRACT.md pilots
        run: |
          status=0
          for skill in plugins/*/skills/*/; do
            [ -f "$skill/CONTRACT.md" ] || continue
            python3 plugins/multiplai-dev/skills/skill-creator/scripts/promote_skill.py \
              "$skill" --contract || status=1
          done
          exit "$status"

  context-tests:
    name: multiplai-context tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The hooks shell out to uv for the memory maintainer and the
      # deferred-extraction subprocess. Without uv on PATH those launches
      # fail — handled, but the lifecycle tests then exercise the degraded
      # path instead of the real one.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The suite imports multiplai-core directly. It comes from the workspace
      # environment now (scripts/pyproject.toml declares it), so this is a
      # `uv sync` rather than a pip install of a separate requirements file.
      - name: Run tests
        working-directory: plugins/multiplai-context
        run: |
          uv run --all-packages --project ../.. --with pytest --with pytest-asyncio \
            --with pytest-timeout python -m pytest tests/ -q

  media-tests:
    name: multiplai-media tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # These tests shim the host tools they probe (ffmpeg, yt-dlp, uname), so
      # they need no real media toolchain — the point is the platform-detection
      # branching and the fix-it messages, not transcoding.
      - name: Run tests
        working-directory: plugins/multiplai-media
        run: uv run --no-project --with pytest python -m pytest tests/ -q

  buildme-tests:
    name: buildme pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # `--extra dev` belongs to the member, not the workspace root, so it
      # needs `--package` too — without it uv reports the extra as undefined.
      - name: Run tests
        working-directory: plugins/multiplai-dev/skills/buildme/scripts
        run: |
          uv run --project ../../../../.. --package build-pipeline \
            --extra dev python -m pytest tests/ -q

  research-tests:
    name: deep-research pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run tests
        working-directory: plugins/multiplai-research/skills/deep-research/scripts
        run: |
          uv run --project ../../../../.. --package research-pipeline \
            --extra dev python -m pytest tests/ -q

  apple-tests:
    name: multiplai-apple tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # swift-build is macOS-only, but what these tests check is the *refusal*:
      # a Linux runner is the environment where a plain-Linux user's error
      # message can be asserted for real. They shim `uname` and run the script
      # with a scratch HOME — no Xcode, no SSH, no Mac needed.
      - name: Run tests
        working-directory: plugins/multiplai-apple
        run: uv run --no-project --with pytest python -m pytest tests/ -q
