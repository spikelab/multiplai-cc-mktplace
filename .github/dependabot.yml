# Scheduled dependency updates.
#
# Why this exists: on 2026-07-30 this repo carried 21 open Dependabot alerts
# (9 high), every one of them transitive and every one of them in a single
# lockfile — plugins/multiplai-dev/skills/buildme/scripts/uv.lock — while the
# sibling deep-research lock in the same repo sat fully patched. Nothing was
# wrong with the declared dependencies; one lock had simply not been
# regenerated in a long time and no process existed to notice. Scheduled
# updates are the fix for that failure mode, so every uv project here is
# enrolled explicitly.
#
# As of 2026-08-04 there is one uv workspace at the repo root and one uv.lock
# covering every plugin, so there is one entry below instead of three. Adding a
# new plugin no longer means adding an entry here — but it does mean adding the
# directory to [tool.uv.workspace] members in /pyproject.toml, which
# scripts/lint_workspace.py enforces.
#
# This also closed a real blind spot rather than just tidying: dependencies
# used to be declared in PEP 723 inline script metadata, which Dependabot
# cannot parse at all. 29 declarations of multiplai-core were invisible to it.
# Manifests are the only thing it scans, so moving them into pyproject.toml is
# what made them visible.
#
# Known gap: Dependabot does not bump git-sourced dependencies, and
# multiplai-core is declared as a git URL. It will not be updated by these PRs
# until core is published to PyPI.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn, so the noise stays reviewable. Security
      # updates are deliberately NOT grouped — Dependabot raises those
      # separately and immediately regardless of this schedule.
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Test/dev toolchain for the memory engine (pytest et al).
  - package-ecosystem: "pip"
    directory: "/plugins/multiplai-context"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
